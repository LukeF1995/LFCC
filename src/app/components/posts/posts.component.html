<div class="post-wrapper">
  <div class="title">
    <h4>{{ postItem.title }}</h4>
    <span>({{ postItem.url }})</span>
  </div>
  <div class="post-details">
    <div>
      {{ postItem.score }} points
      <span *ngIf="postItem.kids?.length">
        | {{ postItem.kids?.length }} comments</span
      >
    </div>
  </div>
</div>
